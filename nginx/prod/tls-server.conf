# ==============================================================================
# Server TLS 443 cho môi trường production.
# deploy/tls/issue_tls.sh copy file này vào nginx/runtime/10-tls.conf SAU khi
# certbot cấp cert thành công, sau đó reload Nginx — không downtime.
# Cert name cố định "saas-backend" để đường dẫn không phụ thuộc tên miền DuckDNS.
# ==============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/saas-backend/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saas-backend/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root  /usr/share/nginx/html;
    index index.html;

    # Giới hạn body: 26 MB để backend tự trả 413 ở ngưỡng 25 MB.
    client_max_body_size 26m;

    # Bản sao security-headers.conf + HSTS (chỉ đúng khi đã có TLS).
    include /etc/nginx/security-headers-tls.conf;

    # -------------------------------------------------------------------------
    # API: FastAPI (SSE không buffer, timeout dài cho stream + upload).
    # -------------------------------------------------------------------------
    location /api/v1/ {
        limit_req zone=api_limit burst=100 nodelay;

        proxy_pass http://fastapi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ghi đè thay vì nối chuỗi: chống client giả mạo X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Bắt buộc cho Server-Sent Events: không gom buffer, không cache.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 120s;
        chunked_transfer_encoding on;

        # Edge là nguồn duy nhất phát security headers: loại header trùng do
        # FastAPI middleware thêm vào, tránh 2 giá trị Referrer-Policy xung đột.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        include /etc/nginx/security-headers-tls.conf;
    }

    # Health check (uptime monitor bên ngoài gọi https://<host>/health).
    location = /health {
        proxy_pass http://fastapi_app/api/v1/health;
        proxy_set_header Host $host;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        include /etc/nginx/security-headers-tls.conf;
    }

    # -------------------------------------------------------------------------
    # Static SPA (fallback khi truy cập thẳng backend host; SPA chính nằm trên Vercel).
    # -------------------------------------------------------------------------
    location /assets/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers-tls.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/security-headers-tls.conf;
    }

    location / {
        try_files $uri /index.html;
        include /etc/nginx/security-headers-tls.conf;
    }

    # Chặn Swagger/Redoc/OpenAPI trên production (kể cả SPA fallback che mất).
    location /docs {
        return 404;
    }

    location /redoc {
        return 404;
    }

    location = /openapi.json {
        return 404;
    }
}
