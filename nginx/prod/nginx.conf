# ==============================================================================
# Nginx PRODUCTION (GCP e2-micro + DuckDNS + Let's Encrypt)
# - Bootstrap: chỉ có server :80 (ACME + health + redirect 301 sang HTTPS).
# - Server :443 nằm trong /etc/nginx/runtime/*.conf, do deploy/tls/issue_tls.sh
#   ghi vào SAU khi certbot cấp chứng chỉ (tránh chicken-and-egg khi cert chưa có).
# - Không dùng file này cho local dev/Playwright; local dùng nginx/nginx.conf.
# - Mount qua docker-compose.prod.yml, không bake vào image.
# ==============================================================================
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Gzip nén dữ liệu truyền tải (asset + JSON API).
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/manifest+json;

    # Rate limit tầng IP: 600 requests/phút (10 r/s, burst 100).
    # Hạn ngạch nghiệp vụ thật (30 RPM / 16K TPM mỗi tenant) do backend Token Bucket siết.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;

    upstream fastapi_app {
        server backend:8000;
        keepalive 8;
    }

    # Server TLS 443 (sinh sau khi có cert). Include wildcard với thư mục rỗng là hợp lệ.
    include /etc/nginx/runtime/*.conf;

    server {
        listen 80;
        server_name _;

        client_max_body_size 26m;
        include /etc/nginx/security-headers.conf;

        # ACME HTTP-01: certbot --webroot ghi challenge vào ./certbot/www.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Container HEALTHCHECK gọi http://127.0.0.1/health nên location này KHÔNG redirect.
        location = /health {
            proxy_pass http://fastapi_app/api/v1/health;
            proxy_set_header Host $host;
            # Edge phát security headers duy nhất (xem nginx/prod/tls-server.conf).
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            include /etc/nginx/security-headers.conf;
        }

        # Mọi traffic còn lại đi HTTPS (HSTS được bật ở server 443).
        location / {
            return 301 https://$host$request_uri;
        }
    }
}
