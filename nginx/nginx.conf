# ==============================================================================
# Nginx cho Enterprise AI Knowledge Platform
# - Phục vụ React SPA (history fallback), cache asset theo content-hash của Vite.
# - Reverse proxy /api/v1 → FastAPI, tắt buffering cho SSE stream.
# - Security headers + CSP, ẩn Swagger UI, giới hạn body 26 MB (backend chặn 25 MB).
# - 1 worker: tiết kiệm RAM theo ràng buộc e2-micro 1.0 GB.
# ==============================================================================
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Gzip nén dữ liệu truyền tải (asset + JSON API).
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/manifest+json;

    # Rate limiting zone: 600 requests / phút mỗi IP (10 r/s, burst 100).
    # Một lần tải trang SPA gọi ~6–8 API; nhiều nhân viên sau cùng NAT sẽ dùng chung IP.
    # Hạn ngạch nghiệp vụ thật (30 RPM / 16K TPM mỗi Tenant) do backend Token Bucket siết.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;

    upstream fastapi_app {
        server backend:8000;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Giới hạn body: 26 MB để backend tự trả 413 với thông điệp rõ ràng ở ngưỡng 25 MB.
        client_max_body_size 26m;

        # Security headers mặc định cho toàn server (các location có add_header riêng sẽ include lại).
        include /etc/nginx/security-headers.conf;

        # ---------------------------------------------------------------------
        # API: FastAPI (SSE không buffer, timeout dài cho stream + upload).
        # ---------------------------------------------------------------------
        location /api/v1/ {
            limit_req zone=api_limit burst=100 nodelay;

            proxy_pass http://fastapi_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Ghi đè thay vì nối chuỗi: chống client giả mạo X-Forwarded-For.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Bắt buộc cho Server-Sent Events: không gom buffer, không cache.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 120s;
            # SSE phải trả về ngay khi backend ghi event.
            chunked_transfer_encoding on;

            # Edge là nguồn duy nhất phát security headers: loại header trùng do
            # FastAPI middleware thêm vào, tránh 2 giá trị Referrer-Policy xung đột.
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;

            include /etc/nginx/security-headers.conf;
        }

        # Health check đi xuyên xuống FastAPI (dùng cho compose healthcheck / probe).
        location = /health {
            proxy_pass http://fastapi_app/api/v1/health;
            proxy_set_header Host $host;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            include /etc/nginx/security-headers.conf;
        }

        # ---------------------------------------------------------------------
        # Static SPA
        # ---------------------------------------------------------------------
        # Asset Vite có content-hash trong tên → cache vĩnh viễn là an toàn.
        location /assets/ {
            expires max;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # index.html không cache để trình duyệt nhận bundle mới ngay sau deploy.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
            include /etc/nginx/security-headers.conf;
        }

        # History fallback cho React Router: mọi deep-link trả index.html.
        location / {
            try_files $uri /index.html;
            include /etc/nginx/security-headers.conf;
        }

        # Chặn Swagger/Redoc/OpenAPI trên môi trường production.
        location /docs {
            return 404;
        }

        location /redoc {
            return 404;
        }

        location = /openapi.json {
            return 404;
        }

        # Lưu ý TLS: khi triển khai thật, thêm listen 443 ssl + chứng chỉ và bật
        # Strict-Transport-Security trong security-headers.conf. Compose hiện map 443
        # để sẵn sàng cho cấu hình TLS của môi trường triển khai.
    }
}
