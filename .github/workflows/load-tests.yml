name: Phase 3 - Load, Soak & Security Probes (k6)

on:
  workflow_dispatch:
    inputs:
      target_api_url:
        description: "Backend URL (vd: https://api-e-k-p-neshaki091.duckdns.org)"
        required: true
        default: "https://api-e-k-p-neshaki091.duckdns.org"
      suite:
        description: "Kịch bản chạy: soak | saturation | spike | probes_only"
        required: true
        type: choice
        options:
          - soak
          - saturation
          - spike
          - probes_only
        default: "soak"
      vus:
        description: "Số VU đồng thời cho soak (mặc định 3, nằm trong 3-5 phiên)"
        required: false
        default: "3"
      duration:
        description: "Thời lượng soak (vd: 30m, 1h, 2h)"
        required: false
        default: "30m"
      chat_mode:
        description: "Chế độ chat cho k6 soak: mock (không tốn quota Gemini) | hybrid"
        required: false
        default: "mock"
  schedule:
    # 10:00 UTC+7 (03:00 UTC) ngày 15 và 30 hằng tháng chạy stress test định kỳ
    - cron: "0 3 15,30 * *"

jobs:
  load-test:
    name: Run k6 & Python Load/Security Probes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Minimal Python Probe Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Seed Synthetic Tenants & Run IDOR / SSE Probes
        run: |
          TARGET_URL="${{ inputs.target_api_url || vars.SIM_TARGET_API_URL || 'https://api-e-k-p-neshaki091.duckdns.org' }}"
          mkdir -p load_tests/reports
          python load_tests/seed_test_data.py --base-url "$TARGET_URL"
          python load_tests/idor_probe.py
          python load_tests/sse_probe.py

      - name: Run k6 Suite
        if: "${{ github.event_name == 'schedule' || inputs.suite != 'probes_only' }}"
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "==> Scheduled Stress Run (ngày 15 & 30): chạy saturation + spike"
            k6 run --summary-export load_tests/reports/k6_saturation.json load_tests/k6/saturation.js
            k6 run --summary-export load_tests/reports/k6_spike.json load_tests/k6/spike.js
          else
            SUITE="${{ inputs.suite || 'soak' }}"
            VUS="${{ inputs.vus || '3' }}"
            DURATION="${{ inputs.duration || '30m' }}"
            CHAT_MODE="${{ inputs.chat_mode || 'mock' }}"
            if [ "$SUITE" = "saturation" ]; then
              k6 run --summary-export load_tests/reports/k6_saturation.json load_tests/k6/saturation.js
            elif [ "$SUITE" = "spike" ]; then
              k6 run --summary-export load_tests/reports/k6_spike.json load_tests/k6/spike.js
            else
              k6 run -e VUS="$VUS" -e DURATION="$DURATION" -e CHAT_MODE="$CHAT_MODE" \
                --summary-export load_tests/reports/k6_soak.json \
                load_tests/k6/journey1_employee.js
            fi
          fi

      - name: Publish k6 Summary with Timestamp to Step Summary
        if: always()
        run: |
          python - << 'EOF'
          import glob, json, os
          from datetime import datetime, timedelta, timezone

          summary_path = os.getenv("GITHUB_STEP_SUMMARY")
          if not summary_path:
              raise SystemExit(0)

          now_utc = datetime.now(timezone.utc)
          now_vn = now_utc + timedelta(hours=7)
          lines = [
              "# Báo cáo Load / Stress Test (k6)",
              "",
              f"- **Thời gian chạy (UTC):** `{now_utc.strftime('%Y-%m-%d %H:%M:%S UTC')}`",
              f"- **Thời gian chạy (UTC+7):** `{now_vn.strftime('%Y-%m-%d %H:%M:%S +07:00')}`",
              "",
              "| File báo cáo | Tổng Req | Tỷ lệ lỗi | Avg (ms) | P95 (ms) | Max (ms) |",
              "|---|---|---|---|---|---|",
          ]
          files = sorted(glob.glob("load_tests/reports/k6_*.json"))
          if not files:
              lines.append("| *(không có file k6 JSON)* | - | - | - | - | - |")
          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              m = data.get("metrics", {})
              reqs = m.get("http_reqs", {}).get("values", {}).get("count", 0)
              fail_rate = m.get("http_req_failed", {}).get("values", {}).get("rate", 0.0) * 100.0
              dur = m.get("http_req_duration", {}).get("values", {})
              lines.append(
                  f"| `{os.path.basename(path)}` | `{reqs}` | `{fail_rate:.2f}%` | "
                  f"`{dur.get('avg', 0):.1f}` | `{dur.get('p(95)', 0):.1f}` | `{dur.get('max', 0):.1f}` |"
              )
          lines.append("")
          with open(summary_path, "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          EOF

      - name: Upload Load Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports-${{ inputs.suite || 'soak' }}-${{ github.run_number }}
          path: load_tests/reports/
          retention-days: 90
