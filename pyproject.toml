[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-knowledge-platform"
version = "2.1.0"
description = "Enterprise Multi-Tenant AI Knowledge Platform (Ultra-Lean Architecture)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AI Solution Engineer" }
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend", "backend/app"]
testpaths = ["backend/tests"]
